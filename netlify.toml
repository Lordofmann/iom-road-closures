# Netlify configuration for the Isle of Man road closures site.
#
# This file's main purpose is to stop Netlify from rebuilding (and consuming
# credits) when a commit doesn't actually change the visible page. The daily
# scraper bot often pushes commits that only update internal data files
# (data/news.json, data/baseline.json) without touching index.html. We don't
# want those commits to trigger a deploy.
#
# How the ignore command works: before Netlify starts a build, it runs the
# `ignore` command. If that command exits with status 0, the build is skipped.
# `git diff --quiet HEAD^ HEAD -- index.html` exits 0 when index.html is
# identical between the last two commits, which is exactly when we want to
# skip building.

[build]
  publish = "."
  ignore = "git diff --quiet HEAD^ HEAD -- index.html"
